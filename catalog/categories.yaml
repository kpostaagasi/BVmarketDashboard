    serileriyle karıştırılmamalı — bu doğal gaz, o akaryakıttır). Tarife DÜZENSİZ
    aralıklarla (BOTAŞ kararına bağlı, günler ile aylar arasında değişebilir) güncellenir;
    kaynakta erişilebilir bir tarihsel arşiv YOKTUR (yalnızca güncel tarife sayfası
    — ölçüldü, bkz. ingest/botas.py docstring'i), bu yüzden seriler tek nokta ile
    başlar ve BOTAŞ her tarife değiştirdiğinde ingest'in bir sonraki koşusunda otomatik
    yeni nokta eklenerek zamanla gerçek bir tarihçeye dönüşür.
