    finansal ve fiş metrikleri ÇEYREKLİK "Bilgilendirme Notu"ndan — TÜMÜ yıl başından
    o çeyrek sonuna KÜMÜLATİFTİR (1Ç yalnızca 1Ç''yi, 9A Ocak-Eylül''ü, yıl sonu raporu
    tüm yılı kapsar; çeyrek-tek DEĞİL). BigChefs''in aylık şube bildirimi Mart 2026''dan
    sonra kesildi (yalnızca çeyreklik faaliyet raporlarından takip edilebiliyor) —
    bu adaptör yalnızca aylık bildirim tarihini kullanır, bu yüzden şube sayısı serisinin
