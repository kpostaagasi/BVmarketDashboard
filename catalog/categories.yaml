  pano:
  - ihracat-ulke-grubu/ortadogu-ulkeleri
  - ihracat-ulke-grubu/bagimsiz-devletler-toplulugu
  - ihracat-ulke-grubu/kuzey-amerika-serbest-ticaret
  note: Kaynak TİM'in kendi "Ülke Gruplarına Göre İhracat" bülteni (AB, Ortadoğu,
    Diğer Avrupa, Afrika, BDT, Kuzey Amerika Serbest Ticaret, Diğer Asya, Diğer Amerikan,
    Uzakdoğu, Serbest Bölgeler, Okyanusya, Diğer Ülkeler — 12 grup); değerler Bin
    USD ve AYLIKTIR. Ülke→grup eşlemesi TİM'in kendisi tarafından yapılmıştır, burada
    türetilmez. Bültenin YENİ (tek anahtarlı, 2023 Temmuz'dan itibaren ağırlıklı)
    ve ESKİ (SEKTÖR×ÜLKEGRUP çapraz tablo, il/ülke bültenleriyle aynı şablon) iki
    üretim biçimi arasında KRONOLOJİK OLMAYAN bir sırayla geçiş yapıyor; adaptör dosyanın
    kendi başlık satırına bakarak hangisini okuyacağına karar verir (sayfa adı güvenilir
    değil). "TOPLAM" serisi (varsa) bültenin kendi TOPLAM satırıdır — il/ülke'nin
    aksine burada bu satır gerçekten yayımlanıyor.
- slug: sermaye-piyasalari
  title: Sermaye Piyasaları (TSPB)
  grup: Finans
  pano:
  - sermaye-piyasalari/pys-aum-yatirim-fonu
  - sermaye-piyasalari/pys-musteri-fon-sayisi
  - sermaye-piyasalari/kredili-kredi-hacmi
  - sermaye-piyasalari/kredili-kullanan-yatirimci-sayisi
  note: Kaynak TSPB (Türkiye Sermaye Piyasaları Birliği) "Veriler" sayfası (https://tspb.org.tr/veriler/).
    Bu pretty URL requests/curl ile çekildiğinde TSPB'yle ilgisi olmayan bir Shopify/kumar
    sitesine (ALTARTOTO) yönleniyor — sunucu tarafında gerçekten önbellekli (Varnish
    X-Cache HIT + Age), muhtemelen ters proxy/CDN yapılandırma hatası ya da sayfa
    ele geçirme; adaptör bu yüzden WordPress REST API'sinden (`wp-json/wp/v2/pages?slug=veriler`)
    okur (bkz. `ingest/tspb.py` docstring'i). AUM/gelir/müşteri-fon sayısı serileri
    "PYŞ Aylık" dosyasının; kredili işlem serileri "Krediler" dosyasının ARŞİV+GÜNCEL
    parçalarının birleşiminden gelir — ikisi de her yayında dosya adına zaman damgası
    eklendiği için sabit URL yoktur, indeks her koşuda yeniden taranır. AUM ve Portföy
    Yönetimi Geliri kartlarının "Toplam" değeri katalogda AYRI seri DEĞİLDİR — 4 kategori
    bileşeninin (Bireysel/Yatırım Ortaklığı/Emeklilik Yatırım Fonu/Yatırım Fonu) toplamı
    `core/stats.py` katmanında hesaplanabilir. Aynı şekilde "AUM Büyüme Hızı (YoY
    %)" ve "Ortalama AUM/PYŞ" (=Toplam AUM ÷ Aktif PYŞ Sayısı) türetilmiş oran kartlarıdır,
    ayrı seri değildir. Kredili tarafında "Yatırımcı Başına Kredi Hacmi" de aynı nedenle
    (Kredi Hacmi ÷ Kredi Kullanan Yatırımcı Sayısı) ayrı seri değildir.
