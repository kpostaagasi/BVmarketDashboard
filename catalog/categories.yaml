- slug: guven-endeksleri
  title: Güven Endeksleri (Finans & Ödeme)
  grup: Makro & Piyasa
  pano:
  - guven-endeksleri/fhge-genel
  - guven-endeksleri/kartmetre-genel-nominal
  - guven-endeksleri/kartmetre-genel-reel
  - guven-endeksleri/fhge-sigorta
