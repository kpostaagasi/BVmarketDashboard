    toplamına eşit değil (ölçüldü: 2026-08 için 991 vs gerçek 944) ve alt kırılımların
    kendi PDF sayfaları salt görsel/metinsiz grafik (extract_text/extract_tables boş)
    — bkz. görev raporundaki `bloke`.'
