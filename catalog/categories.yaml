- slug: sanayi
  title: Sanayi & Reel Kesim
  pano:
    [
      sanayi/uretim-endeksi,
      sanayi/kapasite-kullanim,
      sanayi/reel-kesim-guven,
      sanayi/oncu-gostergeler,
    ]
  note: >-
    Sanayi üretim endeksi mevsim ve takvim etkisinden arındırılmıştır ve
    TÜİK tarafından bir ay gecikmeyle yayımlanır; KKO ile güven endeksi
    cari aya kadar gelir.
- slug: dis-ticaret
  title: Dış Ticaret & Ödemeler Dengesi
  pano:
    [
      dis-ticaret/ihracat,
      dis-ticaret/ithalat,
      dis-ticaret/cari-denge,
    ]
  note: >-
    Üçü de aylık akım büyüklüğüdür, Milyon USD cinsinden gösterilir. Cari
    dengede negatif değer açık demektir; ödemeler dengesi verisi dış
    ticaret verisinden bir ay geriden gelir.
- slug: ihracat
  title: İhracat (Sektörel)
  pano:
    [
      ihracat/toplam,
      ihracat/otomotiv,
      ihracat/hazir-giyim,
      ihracat/celik,
    ]
  note: >-
    Kaynak TİM'dir ve takip eden ayın 1–2'sinde yayımlanır — panodaki en
    hızlı makro sinyal. TİM ihracatçı birlikleri kayıtlarını sayar, TÜİK
    gümrük beyanlarının tamamını: TİM toplamı `dis-ticaret/ihracat`
    serisinden yapısal olarak düşüktür (Temmuz 2026: 22.029 karşı 25.623
    milyon USD), ikisi seviye olarak karşılaştırılmamalıdır.
- slug: bankacilik
  title: Bankacılık
  pano:
    [
      bankacilik/net-donem-kari,
      bankacilik/net-faiz-geliri,
      bankacilik/npl-orani,
      bankacilik/sermaye-yeterliligi,
    ]
  note: >-
    Kaynak BDDK Aylık Bülten'in "Gelişmiş Gösterim" ucu, taraf = Sektör
    (banka bazlı veri bu bültende yok). Kar/zarar kalemleri BDDK'da
    yılbaşından kümülatif yayımlanır; burada yıl içinde fark alınarak AYLIK
    akıma çevrilmiştir. Rasyolar yayımlandığı gibidir (kümülatif kâra
    dayandıkları için yıl içinde basamaklı hareket ederler).
- slug: para-banka
  title: Para & Banka
  pano:
    [
      para-banka/kredi-hacmi,
      para-banka/mevduat,
      para-banka/m3,
      para-banka/rezervler,
    ]
  note: >-
    Dördü de stok büyüklüğüdür (dönem sonu bakiyesi); aylık indirgemede
    dönemin son değeri alınır, toplanmaz. Rezervler haftalık (Cuma)
    yayımlanır.
- slug: fonlar
  title: Yatırım Fonları
  pano:
    [
      fonlar/yatirim-fonu-buyukluk,
      fonlar/yatirim-fonu-hesap,
      fonlar/emeklilik-fonu-buyukluk,
      fonlar/yatirim-fonu-sayisi,
    ]
  note: >-
    Kaynak TEFAS. Değerler AY SONU STOKUDUR: ayın son yayın gününün tüm fon
    satırları toplanır. TEFAS ucu 5 yıldan eski tarih kabul etmediği için
    seriler beş yıl geriye gider. "Hesap sayısı" fon bazındadır — aynı
    yatırımcı iki fondaysa iki kez sayılır, yani yatırımcı sayısı değildir.
- slug: havacilik
  title: Havacılık
  pano:
    [
      havacilik/turkiye,
      havacilik/thy,
      havacilik/pegasus,
      havacilik/istanbul-havalimani,
    ]
  note: >-
    Kaynak EUROCONTROL "Daily Traffic Variation" panosu: günlük IFR uçuş
    sayısı (yolcu değil, uçuş). Dosyalar yalnızca cari yılı taşır; seriler
    her satırın "önceki yıl referansı" sütunuyla bir yıl geriye uzatılır,
    bu yüzden geçmiş iki yılla sınırlıdır. Havayolu serileri şirketin TÜM
    ağını sayar (yurt dışı bacaklar dahil), havalimanı serileri o
    havalimanına iniş/kalkışları.
- slug: insaat
  title: İnşaat
  pano:
    [
      insaat/konut-satis-toplam,
      insaat/konut-satis-ipotekli,
      insaat/konut-fiyat-endeksi,
      insaat/kira-endeksi,
    ]
- slug: kredi-karti
  title: Kredi Kartı Harcamaları
  pano:
    [
      kredi-karti/harcama-toplam,
      kredi-karti/market,
      kredi-karti/akaryakit,
      kredi-karti/giyim,
    ]
  note: >-
    Haftalık (Cuma) akım verisidir; sektör serileri toplamın alt
    kalemleridir, nominal TL olduğu için seviye karşılaştırmaları enflasyon
    içerir.
- slug: emtia-enerji
  title: Emtia · Enerji
  pano: [emtia-enerji/brent, emtia-enerji/wti, emtia-enerji/dogalgaz]
  note: >-
    Fiyatlar sürekli ön vade (front-month) kontratlarıdır; vade
    değişimlerinde grafikte görülen sıçrama piyasa hareketi değil
    kontrat roll'üdür.
- slug: emtia-metaller
  title: Emtia · Metaller
  pano:
    [
      emtia-metaller/altin,
      emtia-metaller/gumus,
      emtia-metaller/bakir,
      emtia-metaller/hrc-celik,
    ]
  note: >-
    Fiyatlar sürekli ön vade (front-month) kontratlarıdır; vade
    değişimlerinde grafikte görülen sıçrama piyasa hareketi değil
    kontrat roll'üdür.
- slug: elektrik
  title: Elektrik
  pano: [elektrik/uretim, elektrik/ptf]
  note: >-
    Üretim ve PTF saatlik yayımlanır; üretim günlük toplama, PTF günlük
    ortalamaya indirgenmiştir.
- slug: otomotiv
  title: Otomotiv
  pano: [otomotiv/ford-otosan, otomotiv/tofas, otomotiv/turk-traktor, otomotiv/karsan]
  note: >-
    Üretim adetleri OSD aylık üretim bültenlerinden alınır; bülten genelde
    takip eden ayın 12–18'i arasında yayımlanır.
- slug: beklentiler
  title: Beklentiler (Piyasa Anketi)
  pano:
    [
      beklentiler/tufe-yilsonu,
      beklentiler/politika-faizi-12a,
      beklentiler/usdtry-12a,
      beklentiler/gsyh-buyume,
    ]
  note: >-
    Kaynak TCMB Piyasa Katılımcıları Anketi'nin "Uygun Ortalamalar" tablosu:
    gerçekleşme değil KATILIMCI KONSENSÜSÜdür ve anketin yapıldığı ayı
    etiketler. Mevsimsellik grafiği bilinçli olarak yok — beklenti serisinin
    mevsimi değil, patikası okunur. Cari denge beklentisinde negatif değer
    açık demektir.
- slug: ihracat-il
  title: İhracat (İl × Sektör)
  pano:
    [
      ihracat-il/istanbul-toplam,
      ihracat-il/bursa-toplam,
      ihracat-il/izmir-toplam,
      ihracat-il/kocaeli-toplam,
    ]
  note: >-
    Kaynak TİM il×sektör karşılaştırma bülteni; değerler Bin USD ve
    AYLIKTIR (o ayın 1'inden son gününe). Bir ilin "Toplam" serisi
    bültenin kendi TOPLAM satırı DEĞİL, o ilin sektör satırlarının
    toplamıdır — bülten TOPLAM satırı birlik bazlı bir fazlalık taşır ve
    referans site parite ölçütü sektör toplamıdır.
- slug: ihracat-ulke
  title: İhracat (Ülke × Sektör)
  pano:
    [
      ihracat-ulke/almanya-toplam,
      ihracat-ulke/abd-toplam,
      ihracat-ulke/irak-toplam,
      ihracat-ulke/italya-toplam,
    ]
  note: >-
    Kaynak TİM ülke×sektör karşılaştırma bülteni; değerler Bin USD ve
    AYLIKTIR (o ayın 1'inden son gününe). Bir ülkenin "Toplam" serisi
    bültenin kendi TOPLAM satırı DEĞİL (böyle bir satır ülke başına hiç
    yayımlanmıyor), o ülkenin sektör satırlarının toplamıdır.
- slug: perakende
  title: Perakende (Şirket Operasyonel Verileri)
  pano:
    [
      perakende/ebebek-satis-adedi,
      perakende/ebebek-magaza-ziyaretci,
      perakende/ebebek-web-ziyaret,
      perakende/ebebek-toplam-magaza,
    ]
  note: >-
    Kaynak ebebek Yatırımcı İlişkileri'nin aylık KAP Özel Durum
    Açıklamaları (Satış Adedi / Ziyaretçi Sayısı / Mağaza Sayısı).
    "Mega Mağaza" kırılımı Ağustos 2026 bildiriminden itibaren ayrı
    raporlanıyor; öncesinde standart mağaza içindeydi (sınıflandırma
    değişikliği, gerçek kapanış değil).
- slug: petrol-piyasasi
  title: Petrol Piyasası (EPDK)
  pano:
    [
      petrol-piyasasi/rafineri-uretimi-motorin,
      petrol-piyasasi/yurtici-satis-motorin,
      petrol-piyasasi/rafineri-uretimi-benzin,
      petrol-piyasasi/yurtici-satis-benzin,
    ]
  note: >-
    Kaynak EPDK Aylık Sektör Raporu'nun çok tablolu EK dosyası. Bu dosya
    biçimi Ocak 2026'da başladı; öncesinde ek yalnızca il bazında teslim
    matrisi taşıyor, ürün grubu toplamı yok — seriler bu yüzden 2026'dan
    başlar. Değerler bin ton.

