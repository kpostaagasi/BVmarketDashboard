    Yönelim Anketi'nin finansal hizmetler bacağıdır; Kartmetre BKM'nin kartlı ödeme
    harcama endeksidir (TCMB EVDS üzerinden yayımlanır). Kartmetre serileri seviye
    (index) endeksidir — "Yıllık % Değişim" görünümü sayfanın YoY görünüm seçicisiyle
    (Varsayılan/YoY/MoM) elde edilir, ayrı seri gerekmez.
- slug: milli-gelir
  title: Milli Gelir (GSYİH)
  grup: Makro & Piyasa
  pano:
  - milli-gelir/gsyih-toplam
  - milli-gelir/sanayi
  - milli-gelir/insaat
  - milli-gelir/ticaret-ulastirma-konaklama
  note: 'Kaynak TÜİK / TCMB EVDS, "Üretim Yöntemiyle Gayrisafi Yurt İçi Hasıla" grubu
    (bie_gsyhuretzinc), İktisadi Faaliyet Kollarına (A10) göre ZİNCİRLENMİŞ HACİM
    (sabit fiyatlarla, mevsim/takvim etkisinden ARINDIRILMAMIŞ ham seri). ÇEYREKLİKTİR
    — `date` çeyreğin ilk ayına indirgenir (Ç1→01, Ç2→04, Ç3→07, Ç4→10). "YoY Büyüme
    %" ve "Sektör Payı %" görünümleri TÜM kartlarda app katmanında (sayfanın YoY görünüm
    seçicisi / core/stats.py) türetilir — bu 11 seri YALNIZCA ham zincirlenmiş hacim
    seviyesini taşır, ayrı bir "büyüme" serisi yoktur. UYARI: bu grubun YoY% çıktısı,
    TÜİK''in dönemsel REVİZYONLARI nedeniyle referans anlık görüntüsünden birkaç puan
    sapabilir (bkz. agent raporunun parite bölümü, milli_gelir satırı) — seviye verisi
    doğru, revizyon farkı veri kalitesi sorunu değildir.'
- slug: tcmb-swap
  title: TCMB Döviz/Altın-TL Swap Piyasası
  grup: Makro & Piyasa
  pano:
  - tcmb-swap/toplam-alim-stok
  - tcmb-swap/toplam-satim-stok
  - tcmb-swap/altin-satim-stok
  - tcmb-swap/doviz-tl-stok
  note: Kaynak TCMB EVDS, bie_swaptektarf grubu (TCMB Taraflı Swap İşlemleri). İŞ
    GÜNÜ frekanslı; "Stok" son işlem gününün açık pozisyonu, "Akım" o günkü net işlem
    tutarıdır (aylık indirgemede stok=last, akım=sum). Kanal isimleri (Geleneksel
    İhale, Miktar İhalesi, Altın İhale, BIST Swap, Depo İşlemine Dönen) TCMB'nin kendi
    seri adlarıdır. "Net Swap Pozisyonu" (Alım−Satım) ve "Toplam" büyüklükler app
    katmanında (fark/toplam) türetilebilir — toplam-alim-stok ve toplam-satim-stok
    zaten grubun kendi TOPLAM satırlarıdır, ayrıca toplanmaz.
