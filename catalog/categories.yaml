    metin, XLSX/PDF değil — düzenli cümle kalıpları regex ile ayrıştırılır). Türkiye''nin
    dört miktar kalemi Bin ton''a, iki değer kalemi Milyon USD''ye normalize edilir
    (bülten ay bazında bin/milyon ton ve milyon/milyar dolar arasında geçiş yapıyor).
    Dünya/Çin/Hindistan ham çelik üretimi worldsteel verisine dayanır ve bültende
    YALNIZCA yılbaşından kümülatif verilir; aylık değer ardışık ayların kümülatif
    farkıyla türetilir (Ocak kendi başına aylıktır). Pencere 2025-01''den başlar:
    2021-2024 bültenleri farklı fiil kalıpları ("artarak" gibi ulaç) kullanıyor ve
    bilinçli olarak kapsam dışı bırakıldı.'
