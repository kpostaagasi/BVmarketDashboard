    aylık) penceresi çekilerek ~22 aylık (2024-09''dan itibaren) seri elde edilir;
    liste sayfasının tam sayfalama şeması çözülmediğinden daha eski veri yok. "Tekstil
    Sektörü Toplam İhracat" (agrega) ve "Dokuma Kumaş"ın beş alt kırılımı (Pamuklu/SSE
