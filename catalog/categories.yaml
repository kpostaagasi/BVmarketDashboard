  note: 'Yabancı ziyaretçi sayısı Kültür ve Turizm Bakanlığı Sınır İstatistikleri
    Bülteni''nden (aylık, kesin), seyahat geliri/gideri/kişi başı ortalama harcama
    TCMB EVDS `bie_sgegi` grubundan, konaklama geceleme (toplam/ yerli/yabancı) Eurostat
    `tour_occ_nim`den gelir — üçü de farklı kaynak ve farklı referans dönemidir (bülten
    ~2 ay, EVDS ~2.5 ay, Eurostat ~9 ay gecikmeli), doğrudan toplanmamalı/karşılaştırılmamalıdır.
    "Net Seyahat Geliri" (gelir − gider) ve "Seyahat Geliri/Gideri/Net" bileşik kartı
    katalogda YOK: EVDS bunu tek bir seri olarak yayımlamıyor, mevcut Seri şeması
    iki seriyi çıkararak üçüncü bir seri üretmeyi (kaynaklar-arası bileşik/computed
    seri) desteklemiyor — bkz. görev raporu. TCMB EVDS''in eski "yabancı ziyaretçi"
    alt kırılımı (K5-K10) artık boş yayımlanıyor (ölçüldü 2026-09-18), bu yüzden Kültür
    ve Turizm Bakanlığı''nın kendi "Gelen Yabancılar" tablosu kullanılmıştır.'
