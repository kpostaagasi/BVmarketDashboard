    2026''ya kadar gösterir) — adaptör bunu bugünün ayından geriye deneyerek çözer,
    tablo etiketleri gerçek ayı belirler. Buğday/durum buğdayı serileri TAKVİM AYI
    değil MAHSUL YILI (Temmuz-Haziran) tablosundan takvim ayına çevrilerek üretilir.
    Her aylık PDF yalnızca son ~3 yıllık kayan bir pencere taşır (TİM''in tam geçmiş
    dosyalarının aksine); bu adaptör TEK bir (en güncel) PDF''i çeker ve o pencereyle
    sınırlıdır.'
