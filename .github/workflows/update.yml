name: daily-data-update

on:
  schedule:
    - cron: "0 5 * * *" # her gün 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ingest

      # Faz 1'de EVDS kullanılacağı için secret şimdiden tanımlı olacak;
      # ingest modülleri env yoksa o kaynağı atlamalı (fail izole).
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push
