name: Veri güncelle

on:
  # Zamanlama cron-job.org'da (GitHub schedule'ı bu hesapta 4-6 saat
  # gecikiyor): her gün 09:00 TSİ workflow_dispatch. Pzt/Per tam koşu (freq
  # boş), diğer günler freq=daily,weekly ile tetiklenir.
  workflow_dispatch:
    inputs:
      freq:
        description: "Sıklık filtresi (boş = tüm seriler, ör. daily,weekly)"
        required: false
        default: ""

permissions:
  contents: write

# Aynı anda tek veri koşusu: 23 Eylül'de gecikmeli zamanlanmış koşu elle
# başlatılanla üst üste bindi, ikisi aynı CSV'leri yazdı ve ikincinin push'u
# içerik çakışmasıyla düştü. Yeni koşu öncekini iptal etmez, bitmesini bekler
# (GitHub en fazla bir bekleyen koşu tutar; üçüncüsü gelirse bekleyen düşer).
concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Takılan bir kaynak 6 saatlik varsayılan sınırı (360 dk) yakmasın.
    # Repo public: dakika ücretsiz, sınırın işi yalnızca takılmayı kesmek.
    # 23 Eylül tam koşusu 90 dk'da 2.807/3.706 seride kesildi.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements-ingest.txt

      - name: Verileri çek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          ELLE_FREQ: ${{ inputs.freq }}
        # Günlük/haftalık seriler her gün; aylık/çeyreklik/yıllık seriler
        # (katalogun ~%70'i) yalnızca Pazartesi ve Perşembe çekilir.
        # Elle tetiklemede varsayılan tam koşudur.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FREQ="$ELLE_FREQ"
          elif [ "$(date -u +%u)" = "1" ] || [ "$(date -u +%u)" = "4" ]; then
            FREQ=""
          else
            FREQ="daily,weekly"
          fi
          echo "Sıklık filtresi: ${FREQ:-tümü}"
          python -u -m ingest.run ${FREQ:+--freq "$FREQ"}

      - name: Değişiklikleri commit'le
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Veride değişiklik yok."
          else
            git commit -m "data: güncelleme $(date -u +%Y-%m-%d)"
            # Koşu sürerken main'e başka commit gelirse düz push reddediliyor
            # ve günün verisi kayboluyordu (23 Eylül: 203 CSV). İş yalnızca
            # data/ yazdığı için kod commit'lerinin üstüne rebase çakışmaz.
            # Yine de aynı CSV'yi başka bir veri commit'i değiştirdiyse
            # `-X theirs` bu koşunun (rebase'de yeniden oynanan commit'in)
            # yeni çektiği dosyayı seçer.
            for deneme in 1 2 3 4 5; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "Push reddedildi (deneme $deneme), yeniden deneniyor..."
              sleep $((deneme * 5))
            done
            exit 1
          fi
