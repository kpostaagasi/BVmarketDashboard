name: Testler

on:
  push:
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
